# Lab 13 · Nhiệm vụ D · Kế hoạch pilot LogiX-VN · Gate 2a
# Đây là kế hoạch giả định của lab, chưa phải xác nhận pilot đã chạy hay đã được duyệt.
# D1: baseline 0,70; mục tiêu ban đầu +5 điểm; alpha 0,05; power 0,80; ICC 0,02.
# a) statsmodels cho raw=1249,5839 -> 1250 yêu cầu/nhóm; công thức z trong docs cho 1251 (lệch <0,1%).
# b) m=75: DE=2,48; 3100 yêu cầu/nhóm (công thức z: 3103); cần 42 NV/nhóm, tổng 84 >40.
# c) 20 NV/nhóm: n_eff <20/0,02=1000, không đủ cho +5 điểm dù tăng m.
# d) 6 depot/nhóm: n_eff <300, chỉ 6 cụm/nhóm, không chọn.
# e) +6 điểm: mục tiêu 859 mẫu hiệu dụng/nhóm; 20 NV x299 yêu cầu =5980 mẫu thô/nhóm.
#    DE=6,96; n_eff=5980/6,96=859,1954; power(+6)=0,8010, power(+5)=0,6418.
# Đánh đổi: chấp nhận bỏ sót tác động thật +5 điểm; không gọi không có ý nghĩa là không có tác động.
# D2.1: Đối chứng cùng ngày, cùng depot và cùng tiêu chí yêu cầu; không so trước/sau đơn thuần.
# D2.2: Ngẫu nhiên staff, seed=13; phân tầng depot, tổng 20+20; depot lẻ dùng cân bằng toàn cục.
# D2.3: Tách quyền tài khoản, không chia sẻ gợi ý/đổi staff giữa hai nhánh; ghi spillover vào audit.
# D2.4: Chốt chỉ số, cohort, ngưỡng, ngày quyết định trước start_date; không xem hiệu quả giữa kỳ.
# D2.5: Đúng 20 cụm/nhóm. Phải có roster đủ 40 NV; mẫu CSV chỉ gồm 20 NV ở 6 depot.
# An toàn hiện tại: mở lại 51/1200=4,25%; phạm vi 39/982=3,97%; hang_nang 13/158=8,23%.
# Ngưỡng 6% áp dụng toàn phạm vi, không áp thẳng vào từng loại; luôn báo riêng hang_nang.
# Thời gian xem lại/làm lại và mọi chi phí dẫn từ chúng là simulated; thay bằng phút đo thật tuần 1.

