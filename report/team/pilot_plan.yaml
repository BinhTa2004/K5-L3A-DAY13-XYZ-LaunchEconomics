# Lab 13 · Nhiệm vụ D · Kế hoạch pilot trợ lý hoàn phí LogiX-VN (Gate 2a)
# Điền mọi chỗ có dấu hỏi. Khi nộp, ngoài các dòng chú thích không còn dấu hỏi nào.
# Kiểm tra đọc được: python -c "import yaml; yaml.safe_load(open('../report/team/pilot_plan.yaml'))"
#
# D1 · Cỡ mẫu (baseline 0,70; mục tiêu +5 điểm; alpha 0,05; power 0,8; ICC 0,02)
#   a) Chia theo yêu cầu: 1.250 yêu cầu/nhóm (statsmodels NormalIndPower, raw=1.249,58; công thức chuẩn=1.251).
#   b) Theo nhân viên, m = 75: DEFF = 1 + 74*0,02 = 2,48; cần 3.100 yêu cầu/nhóm -> 42 nhân viên/nhóm (84 tổng) -> LogiX-VN chỉ có 40 nhân viên, KHÔNG đủ người.
#   c) 20 nhân viên mỗi nhóm: cỡ mẫu hiệu dụng tối đa < 20 / 0,02 = 1.000/nhóm -> KHÔNG đạt 1.250 ở câu a.
#   d) 6 depot mỗi nhóm: cỡ mẫu hiệu dụng tối đa < 6 / 0,02 = 300/nhóm -> KHÔNG đạt 1.250 và dưới ngưỡng 20 cụm/nhóm.
#   e) Mức chênh 6 điểm (859 mỗi nhóm), 20 nhân viên mỗi nhóm: m >= 299 yêu cầu/nhân viên (DEFF = 6,96; 5.980 yêu cầu/nhóm; n_eff = 859,2 >= 859).
#
# D2 · Năm câu kiểm tra "tách được tác động" với cách chia đã chọn (unit = staff, 20 nhân viên/nhóm):
#   1. Đối chứng chạy cùng thời gian: Có, 20 nhân viên nhóm đối chứng chạy song song cùng thời điểm với 20 nhân viên nhóm trợ lý.
#   2. Chia ngẫu nhiên hay do người chọn: Chia ngẫu nhiên phân tầng theo depot (mỗi depot chia đều 50/50 nhân viên) trước ngày bắt đầu.
#   3. Ảnh hưởng gián tiếp và cách giảm: Có thể rò rỉ gián tiếp khi đồng nghiệp cùng depot trao đổi; giảm bằng phân tách tài khoản trợ lý, cấm chia sẻ màn hình/gợi ý sang nhóm đối chứng và không luân chuyển ca chéo nhóm.
#   4. Chỉ số chính, ngưỡng, ngày quyết định đã viết trước: Có, chỉ số dong_trong_24h_khong_mo_lai_7_ngay, ngưỡng MDE +6 điểm (từ 0,70 lên >= 0,76), ngày quyết định chốt trước khi chạy.
#   5. Ít nhất 20 cụm mỗi nhóm: Có, đạt đúng 20 cụm (nhân viên) mỗi nhóm (tổng 40 nhân viên).
#
# Đánh đổi đã chấp nhận (nếu cách chia chưa đạt cả hai điều kiện):
#   Chọn chia theo nhân viên (20 cụm/nhóm) để tránh spillover trực tiếp khi cùng 1 nhân viên xử lý cả hai nhánh như chia theo yêu cầu, đồng thời đạt >= 20 cụm/nhóm. Vì trần n_eff = 1.000 < 1.250 nên chấp nhận nới MDE từ +5 điểm lên +6 điểm (0,06), yêu cầu mỗi nhân viên xử lý tối thiểu 299 yêu cầu (5.980 yêu cầu/nhóm, tổng ~4 tuần gồm lộ trình rollout).
#
# Tỉ lệ mo_lai_trong_7_ngay hiện tại và ngưỡng an toàn đã chọn:
#   Dữ liệu chạy thử: toàn bộ 1.200 yêu cầu là 4,25% (51/1.200); riêng phạm vi noi_dia + hang_nang (982 yêu cầu) là 3,97% (noi_dia 3,16%, hang_nang 8,23%). Nếu đặt ngưỡng dừng quá thấp (ví dụ 3-4%) mà không có kiểm soát thì pilot sẽ bị dừng ngay tuần đầu do nhóm hang_nang. Vì vậy đặt ngưỡng dừng an toàn > 5,0% kèm kiểm soát bắt buộc tuần đầu: xem lại 100% câu trả lời nhóm hang_nang và kiểm tra công thức bảng giá trước khi mở pilot.

pilot:
  owner: "Trưởng bộ phận Vận hành CSKH (CS Operations Lead)"
  scope: "Chỉ áp dụng cho yêu cầu noi_dia và hang_nang trên cả 12 depot (loại quoc_te và doi_tac do CPS vượt hoặc sát mức nhân viên tự làm 12.000 đ và tỉ lệ thành công thấp)"
  assignment:
    unit: "staff"
    control_share: 0.5
    randomized: true
  rollout: [0.10, 0.25, 0.50]     # mỗi bước một tuần; từ tuần 3 duy trì 50% (20 nhân viên) tới khi đủ 299 yêu cầu/nhân viên
  primary_metric:
    name: dong_trong_24h_khong_mo_lai_7_ngay
    baseline: 0.70
    mde: 0.06
    alpha: 0.05
    power: 0.80
    n_per_arm: 5980
    design_effect: 6.96
    clusters_per_arm: 20
  identifiability:
    concurrent_control: "Có: 20 nhân viên đối chứng chạy song song cùng thời điểm với 20 nhân viên dùng trợ lý"
    spillover_risk: "Trung bình-thấp: tách quyền truy cập trợ lý theo tài khoản staff_id, cấm chia sẻ gợi ý/màn hình giữa hai nhóm trong cùng depot"
    predeclared: "Có: chỉ số chính, MDE +6 điểm, luật dừng và ngày quyết định chốt trước ngày chạy pilot"
  stop_rules:
    - "NẾU tỉ lệ mo_lai_trong_7_ngay của nhóm trợ lý vượt 5,0% hoặc cao hơn nhóm đối chứng trên 1,5 điểm phần trăm TRONG 7 ngày liên tiếp THÌ Trưởng bộ phận Vận hành CSKH dừng pilot và chuyển về quy trình nhân viên tự làm KHÔNG THÌ không được tăng tỉ lệ rollout sang bước tiếp theo"
    - "NẾU chi phí mỗi việc thành công (gồm phần giờ xem lại và làm lại simulated/đo thực tế) vượt 12.000 đ (mức nhân viên tự làm) TRONG 7 ngày liên tiếp THÌ Quản lý Sản phẩm CSKH tạm dừng mở rộng và rà soát tỉ lệ xem lại/làm lại KHÔNG THÌ không được giữ bước rollout hiện tại sang tuần kế tiếp"
    - "NẾU tỉ lệ bỏ qua gợi ý (sua hoặc bo trên tổng đơn được xem lại) vượt 40% hoặc tỉ lệ nhân viên nhóm trợ lý sử dụng công cụ dưới 50% TRONG 5 ngày làm việc liên tiếp THÌ Trưởng bộ phận Vận hành CSKH tạm dừng pilot để đào tạo lại và chỉnh luồng gợi ý KHÔNG THÌ không được mở rộng thêm nhân viên vào nhóm thử nghiệm"
  interim_looks: "chỉ kiểm tra chỉ số an toàn"
  rollback: "Kỹ sư Trực vận hành (On-call Engineer) tắt feature flag trợ lý theo lệnh Trưởng bộ phận Vận hành CSKH trong vòng 15 phút; toàn bộ yêu cầu hoàn phí chuyển ngay về hàng đợi nhân viên CSKH xử lý thủ công như quy trình chuẩn"
  decision_date: "Sau 28 ngày chạy pilot kể từ ngày khởi chạy (khi đủ tối thiểu 299 yêu cầu/nhân viên ở mỗi nhóm cộng cửa sổ theo dõi 7 ngày mở lại)"
  simulated_inputs:
    - "phut_xem_lai_simulated (số phút nhân viên xem lại giả lập trong logix_requests.csv, dùng tính chi phí xem lại và CPS phạm vi noi_dia + hang_nang)"
    - "phut_lam_lai_simulated (số phút nhân viên làm lại giả lập trong logix_requests.csv, dùng tính chi phí làm lại và CPS phạm vi noi_dia + hang_nang)"
    - "Baseline chỉ số chính 0,70, ICC 0,02 và chi phí nhân viên 2.000 đ/phút (12.000 đ/yêu cầu) theo giả định của lab"
